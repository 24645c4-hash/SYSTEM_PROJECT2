{% extends "authentication/base.html" %}

{% block title %}Password updated | MediManage{% endblock %}

{% block content %}
  <style>
    .success-panel {
      padding: 36px 0 0;
      min-height: 420px;
    }

    .success-heading {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      color: #1c2a39;
      font-weight: 800;
    }

    .success-message {
      margin: 22px 0 18px;
      color: #425669;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .success-action {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .success-action a {
      color: #1d4ed8;
      text-decoration: none;
    }

    .success-action a:hover {
      text-decoration: underline;
    }
  </style>

  <section class="success-panel" aria-live="polite">
    <h1 class="success-heading">Password updated</h1>
    <p class="success-message">Your password has been changed successfully.</p>
    <p class="success-action"><a href="{% url 'authentication:role_redirect' %}">Continue to MediManage</a></p>
  </section>
{% endblock %}
